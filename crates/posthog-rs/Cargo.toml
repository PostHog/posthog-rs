[package]
name = "posthog-rs"
license = "MIT"
version = "0.31.3"
authors = ["PostHog <engineering@posthog.com>"]
description = "Compatibility package for the official PostHog Rust SDK; use posthog for new projects."
repository = "https://github.com/posthog/posthog-rs"
readme = "README.md"
edition = "2018"
rust-version = "1.78.0"

[dependencies]
posthog = { path = "../..", version = "0.31.3", default-features = false }

[features]
default = ["posthog/default"]
async-client = ["posthog/async-client"]
e2e-test = ["posthog/e2e-test"]
error-tracking = ["posthog/error-tracking"]
test-harness = ["posthog/test-harness"]
stateful = ["posthog/stateful"]
tokio = ["posthog/tokio"]
tls = ["posthog/tls"]
tls-no-provider = ["posthog/tls-no-provider"]
tower = ["posthog/tower"]
mcp = ["posthog/mcp"]
