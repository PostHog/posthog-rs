[package]
name = "posthog-ffi"
license = "MIT"
version = "0.0.0"
authors = ["PostHog <engineering@posthog.com>"]
description = "C bindings for the PostHog Rust SDK, for C and C++ applications."
repository = "https://github.com/posthog/posthog-rs"
readme = "README.md"
edition = "2021"
rust-version = "1.78.0"
publish = false

[lib]
name = "posthog_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# The bindings wrap the blocking client, so `async-client` must stay off.
posthog = { path = "../..", default-features = false, features = ["tls"] }
chrono = { version = "0.4.35", default-features = false, features = ["std"] }
serde = "1.0.125"
serde_json = "1.0.64"
uuid = "1.13.2"

[dev-dependencies]
httpmock = "0.8"

# Standalone workspace: the root workspace enables `posthog/async-client`
# through the compliance adapter, which would replace the blocking client.
[workspace]

[profile.release]
lto = true
codegen-units = 1
# Cargo's default `strip = "debuginfo"` produces a dylib that Apple's ld
# (ld-1221+) rejects with "mis-aligned LINKEDIT string pool".
strip = false
