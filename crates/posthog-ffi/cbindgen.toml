language = "C"
cpp_compat = true
include_guard = "POSTHOG_H"
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "doxy"
header = """
/*
 * C bindings for the PostHog Rust SDK.
 *
 * Generated by cbindgen from crates/posthog-ffi/src/lib.rs. Do not edit;
 * run `cbindgen --config cbindgen.toml --output include/posthog.h` instead.
 *
 * Ownership: every `*_new` handle and every `char *` written to an `_out`
 * argument belongs to the caller, who frees it with the matching `*_free`
 * function or `posthog_string_free`. Don't shorten a returned string in place
 * before freeing it. `const char *` arguments are borrowed for
 * the duration of the call and must be NUL-terminated UTF-8.
 *
 * Threads: a `PostHogClient` and `PostHogFlags` can be shared between threads.
 * Do not use one `PostHogOptions` or `PostHogEvent` from several threads at once.
 *
 * Errors: calls return `POSTHOG_STATUS_OK` or an error status, and
 * constructors return NULL on error. `posthog_last_error` describes the last
 * error on the calling thread. The free functions don't change it.
 */
"""

[export]
include = ["PostHogStatus", "PostHogFlagState"]
