[package]
name = "posthog-rs"
license = "MIT"
version = "0.29.0"
authors = ["PostHog <engineering@posthog.com>"]
description = "The official Rust client for Posthog (https://posthog.com/)."
repository = "https://github.com/posthog/posthog-rs"
edition = "2018"
rust-version = "1.78.0"

[dependencies]
reqwest = { version = "0.13.2", default-features = false, features = [
    "rustls",
    "blocking",
    "json",
    "gzip",
] }
serde = { version = "1.0.125", features = ["derive"] }
chrono = { version = "0.4.19", features = ["serde"] }
serde_json = "1.0.64"
semver = "1.0.24"
derive_builder = "0.20.2"
uuid = { version = "1.13.2", features = ["serde", "v7"] }
backtrace = { version = "0.3.74", optional = true }
findshlibs = { version = "0.10", optional = true }
os_info = "3.14"
sha1 = ">=0.10.7, <0.12"
regex = "1.10"
tracing = "0.1"
http = { version = "1", optional = true }
tower-layer = { version = "0.3", optional = true }
tower-service = { version = "0.3", optional = true }
tokio = { version = "1", features = [
    "rt",
    "sync",
    "time",
    "macros",
], optional = true }
flate2 = "1.0"
brotli = { version = "9.0", optional = true }
zstd = { version = "0.14", optional = true }
rmcp = { version = "3.7", default-features = false, features = [
    "server",
], optional = true }
url = { version = "2.5", optional = true }
fancy-regex = { version = "0.19", optional = true }
base64 = { version = "0.22", optional = true }
futures-util = { version = "0.3", default-features = false, features = [
    "std",
], optional = true }

[dev-dependencies]
axum = { version = "0.8", default-features = false }
tower = { version = "0.5", features = ["util"] }
dotenv = "0.15.0"
ctor = "1.0.12"
tokio = { version = "1", features = ["full"] }
httpmock = "0.8"
serde_json = "1.0"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eyre = "0.6.12"
http = "1"
http-body-util = "0.1"
base64 = "0.22"
rmcp = { version = "3.7", features = [
    "server",
    "client",
    "macros",
    "transport-async-rw",
    "transport-io",
    "transport-streamable-http-server",
] }

[features]
default = ["async-client", "error-tracking"]
e2e-test = []
async-client = ["tokio"]
tower = ["async-client", "dep:http", "dep:tower-layer", "dep:tower-service"]
capture-v1 = ["brotli", "zstd"]
test-harness = []
error-tracking = ["dep:backtrace", "dep:findshlibs"]
mcp = [
    "async-client",
    "dep:rmcp",
    "dep:http",
    "dep:url",
    "dep:fancy-regex",
    "dep:base64",
    "dep:futures-util",
]

[workspace]
members = [".", "compliance/adapter"]
