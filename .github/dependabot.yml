version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # Dependabot allows only auto or lockfile-only for cargo; auto keeps in-range bumps lockfile-only.
    versioning-strategy: "auto"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
