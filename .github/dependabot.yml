version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    # Cargo accepts only "auto" or "lockfile-only". "auto" already leaves an in-range
    # bump in Cargo.lock and edits Cargo.toml only for a semver-incompatible release.
    versioning-strategy: "auto"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
