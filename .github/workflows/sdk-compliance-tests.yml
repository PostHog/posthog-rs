name: SDK Compliance Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'compliance/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sdk-compliance-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'compliance/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/sdk-compliance-tests.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  test-rust-sdk:
    uses: PostHog/posthog-sdk-test-harness/.github/workflows/test-sdk-action.yml@6d19abb9c81e2262dacbe340e7dddda9c871c178
    with:
      adapter-dockerfile: compliance/Dockerfile
      adapter-context: .
      test-harness-version: "0.10.0"
      report-name: rust-sdk-compliance-report
      concurrency: 10
