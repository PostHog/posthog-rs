name: "Build C bindings"

# Builds and smoke-tests posthog-ffi for each supported platform, and uploads
# one archive per platform as a workflow artifact. release.yml calls it for a
# posthog-ffi release tag and attaches the archives to that GitHub Release. CI
# calls it on pull requests, where it builds the PR's commit.
on:
  workflow_call:
    inputs:
      version:
        description: "posthog-ffi version, used in the archive names"
        required: true
        type: string
      release:
        description: "Build the release tag posthog-ffi-v<version>. Otherwise build the commit that triggered the run."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: crates/posthog-ffi
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.2.0"
            exit 1
          fi
        working-directory: .

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release && format('refs/tags/posthog-ffi-v{0}', inputs.version) || '' }}
          persist-credentials: false

      - name: Check the posthog-ffi version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate_version=$(grep -m1 '^version = ' Cargo.toml | tr -d '\r' | sed 's/version = "\(.*\)"/\1/')
          if [ "$crate_version" != "$VERSION" ]; then
            echo "::error::Expected posthog-ffi $VERSION, found $crate_version"
            exit 1
          fi

      - name: Set up Rust
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --locked --release -p posthog-ffi --target "$TARGET"

      - name: Smoke test
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          out="../../target/$TARGET/release"
          c++ -std=c++11 -Wall -Wextra -Werror tests/c/smoke.cpp -Iinclude -L"$out" -lposthog_ffi -o smoke
          LD_LIBRARY_PATH="$out" DYLD_LIBRARY_PATH="$out" ./smoke

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          rem Link the DLL's import library. The DLL must sit next to the program.
          cl /nologo /std:c++17 /EHsc /W4 /WX tests\c\smoke.cpp /Iinclude ..\..\target\x86_64-pc-windows-msvc\release\posthog_ffi.dll.lib /Fe:smoke.exe || exit /b 1
          copy /y ..\..\target\x86_64-pc-windows-msvc\release\posthog_ffi.dll . || exit /b 1
          smoke.exe

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          name="posthog-ffi-$VERSION-$TARGET"
          out="../../target/$TARGET/release"
          native_libs=$(cargo rustc --locked --release -p posthog-ffi --lib --target "$TARGET" --crate-type staticlib -- --print native-static-libs 2>&1 \
            | sed -n 's/.*native-static-libs: //p' | tail -1)

          mkdir -p "dist/$name/include" "dist/$name/lib" "dist/$name/examples"
          cp include/posthog.h "dist/$name/include/"
          cp examples/capture.c examples/capture.cpp "dist/$name/examples/"
          cp README.md "dist/$name/"
          cp ../../LICENSE "dist/$name/"
          case "$TARGET" in
            *windows*)
              cp "$out/posthog_ffi.dll" "$out/posthog_ffi.dll.lib" "$out/posthog_ffi.lib" "dist/$name/lib/" ;;
            *apple*)
              cp "$out/libposthog_ffi.dylib" "$out/libposthog_ffi.a" "dist/$name/lib/" ;;
            *)
              cp "$out/libposthog_ffi.so" "$out/libposthog_ffi.a" "dist/$name/lib/" ;;
          esac
          printf '%s\n' "$native_libs" > "dist/$name/lib/native-static-libs.txt"

          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive="$name.tar.gz"
            tar -czf "$archive" "$name"
          fi
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: posthog-ffi-${{ matrix.target }}
          path: |
            crates/posthog-ffi/dist/${{ steps.package.outputs.archive }}
            crates/posthog-ffi/dist/${{ steps.package.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 7
