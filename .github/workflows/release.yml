name: "Release"

on:
  push:
    branches: [main]
    paths:
      - '.sampo/changesets/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Concurrency control: only one release process can run at a time
# This prevents race conditions if multiple releasable changesets merge simultaneously
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-changesets:
    name: Check for changesets
    runs-on: ubuntu-latest
    outputs:
      has-changesets: ${{ steps.check.outputs.has-changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Check for changesets
        id: check
        run: |
          changeset_count=$(find .sampo/changesets -name '*.md' 2>/dev/null | wc -l)
          if [ "$changeset_count" -gt 0 ]; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found $changeset_count changeset(s), ready to release"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
            echo "No changesets to release"
          fi

  notify-approval-needed:
    name: Notify Slack - Approval Needed
    needs: check-changesets
    if: needs.check-changesets.outputs.has-changesets == 'true'
    uses: posthog/.github/.github/workflows/notify-approval-needed.yml@5fc4680761e8ac29a61b212756230eba0e276d8c
    with:
      slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
      slack_user_group_id: ${{ vars.GROUP_CLIENT_LIBRARIES_SLACK_GROUP_ID }}
    secrets:
      slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
      posthog_project_api_key: ${{ secrets.POSTHOG_PROJECT_API_KEY }}

  preserve-slack-thread:
    name: Preserve Slack thread
    needs: notify-approval-needed
    if: needs.notify-approval-needed.outputs.slack_ts != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Save approval thread timestamp
        env:
          THREAD_TS: ${{ needs.notify-approval-needed.outputs.slack_ts }}
        run: printf '%s' "$THREAD_TS" > thread-ts.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-slack-thread-${{ github.run_attempt }}
          path: thread-ts.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release and publish
    needs: [check-changesets, notify-approval-needed]
    runs-on: ubuntu-latest
    if: always() && needs.check-changesets.outputs.has-changesets == 'true'
    environment: "Release"
    permissions:
      contents: read
      actions: write
      id-token: write
    outputs:
      ffi_version: ${{ steps.ffi-pending.outputs.version }}
      ffi_tag: ${{ steps.ffi-release.outputs.tag }}
      ffi_sha: ${{ steps.ffi-pending.outputs.sha }}
    steps:
      - name: Notify Slack - Approved
        if: needs.notify-approval-needed.outputs.slack_ts != ''
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "✅ Release approved! Version bump in progress..."
          emoji_reaction: "white_check_mark"

      - name: Get GitHub App token
        id: releaser
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.GH_APP_POSTHOG_RS_RELEASER_APP_ID }}
          private-key: ${{ secrets.GH_APP_POSTHOG_RS_RELEASER_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.releaser.outputs.token }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1.93.1
        with:
          components: cargo
          toolchain: stable

      - name: Cache Sampo CLI
        id: cache-sampo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/sampo
          key: sampo-0.17.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install Sampo CLI
        if: steps.cache-sampo.outputs.cache-hit != 'true'
        run: cargo install sampo --version 0.17.4 --locked

      - name: Prepare release with Sampo
        id: sampo-release
        env:
          GITHUB_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version_of() { grep -m1 '^version = ' "$1" | sed 's/version = "\(.*\)"/\1/'; }
          if ! find .sampo/changesets -name '*.md' | grep -q .; then
            # A rerun after the release commit landed finds the changesets consumed.
            # Only a posthog-rs-ffi version whose GitHub Release isn't published yet
            # can be finished, whether or not its tag was already pushed.
            ffi_version=$(version_of crates/posthog-rs-ffi/Cargo.toml)
            published=$(gh release view "posthog-rs-ffi-v$ffi_version" --json isDraft --jq '.isDraft == false' 2>/dev/null || echo false)
            if [ "$ffi_version" != "0.0.0" ] && [ "$published" != true ]; then
              echo "::notice::No changesets left. Finishing the posthog-rs-ffi $ffi_version release."
              echo "rerun=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::No changesets to release"
            exit 1
          fi
          old_version=$(version_of Cargo.toml)
          old_ffi_version=$(version_of crates/posthog-rs-ffi/Cargo.toml)
          sampo release
          # Sampo regenerates Cargo.lock, resolving every dependency to its
          # latest version, which can need a newer Rust than the MSRV. Keep the
          # released lock and move only the workspace crates to their new versions.
          git checkout HEAD -- Cargo.lock
          cargo update --workspace
          new_version=$(version_of Cargo.toml)
          ffi_version=$(version_of crates/posthog-rs-ffi/Cargo.toml)
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"
          echo "ffi_version=$ffi_version" >> "$GITHUB_OUTPUT"
          # posthog-rs-ffi has its own version and changesets, so a release can
          # bump either package or both.
          released=()
          if [ "$new_version" != "$old_version" ]; then
            echo "posthog_released=true" >> "$GITHUB_OUTPUT"
            released+=("v$new_version")
          fi
          if [ "$ffi_version" != "$old_ffi_version" ]; then
            echo "ffi_released=true" >> "$GITHUB_OUTPUT"
            released+=("posthog-rs-ffi v$ffi_version")
          fi
          title=$(printf '%s, ' "${released[@]}")
          title=${title%, }
          echo "title=${title:-v$new_version}" >> "$GITHUB_OUTPUT"

      - name: Generate SDK reference
        id: reference
        if: steps.sampo-release.outputs.rerun != 'true'
        # Best-effort: a failure never blocks the release. Run generate-references.yml to retry.
        continue-on-error: true
        run: |
          rustup toolchain install nightly-2026-06-12 --profile minimal
          git clone --depth 1 https://github.com/PostHog/sdk-specs "$RUNNER_TEMP/sdk-specs"
          python3 scripts/generate_markdown.py --sdk-specs "$RUNNER_TEMP/sdk-specs"
          # Stage the pages, so a new page shows in git status as a file, not as an untracked folder.
          git add references

      - name: Warn if the SDK reference didn't regenerate
        if: steps.reference.outcome == 'failure'
        run: echo "::warning::The SDK reference didn't regenerate. Run generate-references.yml to retry."

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet HEAD; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit release changes
        id: release-commit
        if: steps.check-changes.outputs.committed == 'true'
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465
        with:
          commit_message: "chore: Release ${{ steps.sampo-release.outputs.title }} [skip ci]"
          repo: ${{ github.repository }}
          branch: main
        env:
          GITHUB_TOKEN: ${{ steps.releaser.outputs.token }}

      # ghcommit-action commits via the GitHub API, so the local working
      # tree still has dirty and staged files. Discard them (already committed remotely)
      # and check out the release commit itself, otherwise cargo publish fails with
      # "files contain changes not yet committed". Checking out the exact commit,
      # rather than pulling main, keeps a later push to main out of the release.
      - name: Sync local repository
        id: sync
        if: steps.check-changes.outputs.committed == 'true'
        env:
          RELEASE_SHA: ${{ steps.release-commit.outputs.commit-hash }}
        run: |
          git reset --hard
          git fetch origin "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"

      - name: Publish dry-run
        if: steps.check-changes.outputs.committed == 'true' && steps.sampo-release.outputs.posthog_released == 'true'
        run: scripts/check-compatibility-crate.sh && cargo publish --workspace --dry-run --locked --package posthog --package posthog-rs

      - name: Authenticate with crates.io
        if: steps.check-changes.outputs.committed == 'true' && steps.sampo-release.outputs.posthog_released == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: crates-auth

      - name: Configure git identity
        if: steps.check-changes.outputs.committed == 'true' && steps.sampo-release.outputs.posthog_released == 'true'
        run: |
          git config user.name "posthog-rs-releaser[bot]"
          git config user.email "posthog-rs-releaser[bot]@users.noreply.github.com"

      - name: Publish with Sampo
        if: steps.check-changes.outputs.committed == 'true' && steps.sampo-release.outputs.posthog_released == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.releaser.outputs.token }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: sampo publish

      - name: Create GitHub Release
        if: steps.check-changes.outputs.committed == 'true' && steps.sampo-release.outputs.posthog_released == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.releaser.outputs.token }}
          NEW_VERSION: ${{ steps.sampo-release.outputs.new_version }}
        run: |
          CHANGELOG_ENTRY=$(awk -v defText="see CHANGELOG.md" '/^## /{if (flag) exit; flag=1; next} flag; END{if (!flag) print defText}' CHANGELOG.md | sed '/[^[:space:]]/,$!d' | tac | sed '/[^[:space:]]/,$!d' | tac)
          # Tag the commit that was just published, not whatever main points to now.
          gh release create "$NEW_VERSION" --target "$(git rev-parse HEAD)" --notes "$CHANGELOG_ENTRY"

      - name: Dispatch posthog upgrade for posthog-rs
        if: steps.check-changes.outputs.committed == 'true' && steps.sampo-release.outputs.posthog_released == 'true'
        env:
          PACKAGE_VERSION: ${{ steps.sampo-release.outputs.new_version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -f -sS -X POST \
               -H "Accept: application/vnd.github+json" \
               -H "Authorization: Bearer $GITHUB_TOKEN" \
               https://api.github.com/repos/posthog/posthog-rs/actions/workflows/posthog-upgrade.yml/dispatches \
               -d "$(jq -n \
                 --arg ref "main" \
                 --arg package_name "posthog-rs" \
                 --arg package_version "$PACKAGE_VERSION" \
                 '{ref: $ref, inputs: {package_name: $package_name, package_version: $package_version}}' \
               )"

      - name: Find an unpublished posthog-rs-ffi release
        id: ffi-pending
        # Runs even if publishing posthog failed: the release commit is already on main.
        if: ${{ !cancelled() && (steps.sync.outcome == 'success' || steps.sampo-release.outputs.rerun == 'true') }}
        env:
          # The releaser token can see draft releases, which `github.token` can't.
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(grep -m1 '^version = ' crates/posthog-rs-ffi/Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          published=$(gh release view "posthog-rs-ffi-v$version" --json isDraft --jq '.isDraft == false' 2>/dev/null || echo false)
          if [ "$version" = "0.0.0" ] || [ "$published" = true ]; then
            echo "No posthog-rs-ffi release waiting to be published."
            exit 0
          fi
          # The commit that set this version is the release commit, on a normal run
          # (HEAD) and on a rerun after it landed.
          sha=$(git log -1 --format=%H -G"^version = \"$version\"\$" -- crates/posthog-rs-ffi/Cargo.toml)
          if [ -z "$sha" ]; then
            echo "::error::No commit set posthog-rs-ffi to $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Tag the posthog-rs-ffi release
        id: ffi-release
        # The GitHub Release is published later, once every platform archive is built.
        if: ${{ !cancelled() && steps.ffi-pending.outputs.version != '' }}
        env:
          GH_TOKEN: ${{ steps.releaser.outputs.token }}
          GH_REPO: ${{ github.repository }}
          FFI_VERSION: ${{ steps.ffi-pending.outputs.version }}
          RELEASE_SHA: ${{ steps.ffi-pending.outputs.sha }}
        run: |
          tag="posthog-rs-ffi-v$FFI_VERSION"
          # `sampo` tags locally only, so create the remote tag here. A rerun that
          # finds it already there must not build a tag that points anywhere else.
          existing=$(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" | awk '{print $1}' | tail -1)
          if [ -z "$existing" ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$RELEASE_SHA" >/dev/null
          elif [ "$existing" != "$RELEASE_SHA" ]; then
            echo "::error::Tag $tag points to $existing, not the release commit $RELEASE_SHA"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Send failure event to PostHog
        if: ${{ failure() }}
        continue-on-error: true
        uses: PostHog/posthog-github-action@9a6a19d360820ab4d95ecc4a5a7564062c895f84 # v1.3.0
        with:
          posthog-token: "${{ secrets.POSTHOG_PROJECT_API_KEY }}"
          event: "posthog-sdk-github-release-workflow-failure"
          properties: >-
            {
              "commitSha": "${{ github.sha }}",
              "jobStatus": "${{ job.status }}",
              "ref": "${{ github.ref }}",
              "repository": "${{ github.repository }}",
              "sdk": "posthog-rs",
              "jobName": "release",
              "packageName": "posthog-rs",
              "packageVersion": "${{ steps.sampo-release.outputs.new_version || 'unknown' }}",
              "actionUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "alertText": ":rotating_light: Failed to release posthog-rs@${{ steps.sampo-release.outputs.new_version }} :rotating_light:",
              "alertContext": "The release workflow failed before completion."
            }

  ffi-build:
    name: Build C bindings
    needs: release
    # The posthog-rs-ffi tag exists once this output is set, even if a later step failed.
    if: ${{ !cancelled() && needs.release.outputs.ffi_tag != '' }}
    uses: ./.github/workflows/ffi-build.yml
    with:
      version: ${{ needs.release.outputs.ffi_version }}
      release: true
      release-commit: ${{ needs.release.outputs.ffi_sha }}

  ffi-publish:
    name: Publish the C bindings GitHub Release
    needs: [release, ffi-build]
    if: ${{ !cancelled() && needs.ffi-build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signed build provenance for the archives, which `gh attestation verify` checks.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: posthog-rs-ffi-*
          path: dist
          merge-multiple: true

      - name: Check every platform is present
        env:
          VERSION: ${{ needs.release.outputs.ffi_version }}
        working-directory: dist
        run: |
          ls -l
          missing=0
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            archive="posthog-rs-ffi-$VERSION-$target.tar.gz"
            [[ "$target" == *windows* ]] && archive="posthog-rs-ffi-$VERSION-$target.zip"
            if [ ! -f "$archive" ] || [ ! -f "$archive.sha256" ]; then
              echo "::error::Missing $archive or its checksum"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          sha256sum -c ./*.sha256

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.ffi_tag }}
          path: source
          persist-credentials: false

      - name: Check the tag still points to the release commit
        env:
          RELEASE_COMMIT: ${{ needs.release.outputs.ffi_sha }}
          TAG: ${{ needs.release.outputs.ffi_tag }}
        run: |
          actual=$(git -C source rev-parse HEAD)
          if [ -z "$RELEASE_COMMIT" ] || [ "$actual" != "$RELEASE_COMMIT" ]; then
            echo "::error::Tag $TAG points to $actual, not the release commit $RELEASE_COMMIT"
            exit 1
          fi

      - name: Publish the GitHub Release with its archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.ffi_tag }}
          VERSION: ${{ needs.release.outputs.ffi_version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
              # `gh release create` uploads to a draft first, so an interrupted
              # run can leave one behind. Finish it.
              gh release upload "$TAG" dist/* --clobber
              gh release edit "$TAG" --draft=false --latest=false
            else
              # Never change a published release's downloads. Only check they're complete.
              mkdir published
              gh release download "$TAG" --pattern '*.sha256' --dir published
              for sum in dist/*.sha256; do
                cmp -s "$sum" "published/$(basename "$sum")" || {
                  echo "::error::The published $(basename "$sum" .sha256) is missing or differs from this build"
                  exit 1
                }
              done
            fi
            exit 0
          fi
          notes=$(awk -v defText="see crates/posthog-rs-ffi/CHANGELOG.md" '/^## /{if (flag) exit; flag=1; next} flag; END{if (!flag) print defText}' source/crates/posthog-rs-ffi/CHANGELOG.md | sed '/[^[:space:]]/,$!d' | tac | sed '/[^[:space:]]/,$!d' | tac)
          gh release create "$TAG" dist/* --verify-tag --title "posthog-rs-ffi $VERSION" --notes "$notes" --latest=false

  notify-released:
    name: Notify Slack - Released
    needs: [check-changesets, notify-approval-needed, release, ffi-publish]
    runs-on: ubuntu-latest
    if: >-
      always() && needs.release.result == 'success' &&
      (needs.release.outputs.ffi_tag == '' || needs.ffi-publish.result == 'success') &&
      needs.notify-approval-needed.outputs.slack_ts != ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notify Slack - Released
        uses: posthog/.github/.github/actions/slack-thread-reply@cb0979b67dcd585828b61ac45927eef4da8f6287 # main
        with:
          slack_bot_token: ${{ secrets.SLACK_CLIENT_LIBRARIES_BOT_TOKEN }}
          slack_channel_id: ${{ vars.SLACK_APPROVALS_CLIENT_LIBRARIES_CHANNEL_ID }}
          thread_ts: ${{ needs.notify-approval-needed.outputs.slack_ts }}
          message: "🚀 Release completed successfully!"
          emoji_reaction: "rocket"
