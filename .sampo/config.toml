# Sampo configuration
version = 1

[git]
default_branch = "main"
short_tags = "posthog"
short_tags_format = "{version}"    # Preserve the existing bare release tags

[github]
repository = "posthog/posthog-rs"

[changelog]
# Options for release notes generation.
# show_commit_hash = true (default)
# show_acknowledgments = true (default)

[packages]
fixed = [["cargo/posthog", "cargo/posthog-rs"]]
ignore = ["compliance/*"]
